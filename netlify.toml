[build]
  base = "/"
  command = "npx playwright install chromium && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  BASCIK_SITE_URL = "https://rinsesoft.com"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
