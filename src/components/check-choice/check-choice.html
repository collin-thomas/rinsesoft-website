<!-- @bascik
A native radio choice for a business-check question.
@prop group - Question's radio group.
@prop value - Choice identifier.
@prop title - Recognizable situation.
@prop text - Short explanation of the choice.
-->
<label class="choice" data-testid="check-choice">
  <input type="radio" data-bascik-attr-name="group" data-bascik-attr-value="value" required data-testid="check-choice-input">
  <span>
    <strong data-bascik-prop-title></strong>
    <span class="detail" data-bascik-prop-text></span>
  </span>
</label>
