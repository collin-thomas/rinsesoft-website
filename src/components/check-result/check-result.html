<!-- @bascik
A practical starting point, not a diagnosis or automatic service recommendation.
@prop key - Branch outcome identifier.
@prop label - Situation reflected by the answers.
@prop title - Suggested area to examine.
@prop text - Why this could be worth examining.
@prop action - A small step the owner can try.
@prop help - How Rinsesoft could help investigate.
-->
<article class="result" tabindex="-1" data-bascik-attr-data-result="key" data-testid="check-result">
  <span class="eyebrow" data-bascik-prop-label></span>
  <h2 data-bascik-prop-title></h2>
  <p data-bascik-prop-text></p>
  <h3>One thing to try</h3>
  <p data-bascik-prop-action></p>
  <h3>Where we could help</h3>
  <p data-bascik-prop-help></p>
  <booking-link class="discussion" data-bascik-prop-label="Continue this discussion with us" data-testid="check-result-schedule" />
  <p class="expectation">A 30-minute conversation about your situation, what you've tried, and a sensible next step.</p>
</article>
