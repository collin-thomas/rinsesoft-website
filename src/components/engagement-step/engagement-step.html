<!-- @bascik
One area of Rinsesoft's services.
@prop number - Service area number.
@prop label - Engagement type.
@prop title - Engagement name.
@prop text - Engagement overview.
@prop outcome - How the ongoing partnership supports the client.
-->
<article class="step" data-testid="engagement-step">
  <header class="summary">
    <div class="meta">
      <span class="phase"><span class="number" data-bascik-prop-number></span><span data-bascik-prop-label></span></span>
    </div>
    <h3 data-bascik-prop-title></h3>
    <p class="intro" data-bascik-prop-text></p>
  </header>
  <div class="details">
    <div class="scope">
      <h4>What we focus on</h4>
      <ul><div data-bascik-slot></div></ul>
    </div>
  </div>
  <div class="outcome" data-testid="engagement-step-outcome">
    <h4>How we partner</h4>
    <p data-bascik-prop-outcome></p>
  </div>
</article>
