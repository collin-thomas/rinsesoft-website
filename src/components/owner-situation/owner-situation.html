<!-- @bascik
An owner ambition and the business improvements that can support it.
@prop label - Owner priority.
@prop title - Recognizable business situation.
@prop text - Context and opportunities.
-->
<section class="situation" data-testid="owner-situation">
  <header>
    <span class="eyebrow" data-bascik-prop-label></span>
    <h2 data-bascik-prop-title></h2>
  </header>
  <div class="body">
    <p data-bascik-prop-text></p>
    <div data-bascik-slot></div>
  </div>
</section>
