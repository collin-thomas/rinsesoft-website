<!-- @bascik
One guide preview with a descriptive title link.
@prop label - Guide topic.
@prop title - Guide title.
@prop description - Guide summary.
@prop href - Guide URL.
-->
<article class="card" data-testid="resource-card">
  <span class="eyebrow" data-bascik-prop-label></span>
  <h3><a data-bascik-attr-href="href" data-bascik-prop-title data-testid="resource-card-link"></a></h3>
  <p data-bascik-prop-description></p>
</article>
