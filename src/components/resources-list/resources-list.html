<!-- @bascik
Ungated business guides, shared by the homepage and resources hub.
-->
<section class="resources section" data-testid="resources-list">
  <section-head data-bascik-prop-label="From our practice"
    data-bascik-prop-title="A business perspective on better systems."
    data-bascik-prop-text="Practical guidance on the decisions behind the work: where to start, what to measure, and when technology is the right investment." />
  <div class="guides">
    <resource-card data-bascik-prop-label="Strategy &amp; roadmapping"
      data-bascik-prop-title="How to turn a business problem into a technology roadmap"
      data-bascik-prop-description="Describe the work, define a better outcome, and choose a first step you can actually measure. Includes a worked example and a copyable planning brief."
      data-bascik-prop-href="/resources/business-problem-roadmap" />
    <resource-card data-bascik-prop-label="Owner bottlenecks"
      data-bascik-prop-title="Why does everything still come back to you?"
      data-bascik-prop-description="Routine questions, missing information, and approvals keep landing on your desk. Trace one workflow and find the handoff worth fixing first."
      data-bascik-prop-href="/owner-bottlenecks" />
    <resource-card data-bascik-prop-label="AI &amp; business decisions"
      data-bascik-prop-title="Can I trust AI to answer questions about my business?"
      data-bascik-prop-description="Weigh the time saved on repeated questions against the cost of a wrong answer and the judgment your team still needs to provide."
      data-bascik-prop-href="/resources/trustworthy-ai-assistant" />
    <resource-card data-bascik-prop-label="Business continuity"
      data-bascik-prop-title="How do I keep essential business knowledge from walking out the door?"
      data-bascik-prop-description="See how relying on one person's memory can affect growth, continuity, onboarding, and your team's ability to move forward."
      data-bascik-prop-href="/resources/capture-business-knowledge" />
    <resource-card data-bascik-prop-label="AI &amp; business decisions"
      data-bascik-prop-title="When should a small business automate a process with AI?"
      data-bascik-prop-description="Consider whether the potential benefit is worthwhile, the work follows a dependable pattern, and the risks are acceptable."
      data-bascik-prop-href="/resources/ai-automation-readiness" />
  </div>
</section>
