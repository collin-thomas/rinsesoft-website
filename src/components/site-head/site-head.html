<!-- @bascik
Shared page metadata and crawler tags.
@prop title - Page title used in browser tabs and social previews.
@prop description - Page summary used by search engines and social previews.
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Rinsesoft">
<meta name="twitter:card" content="summary_large_image">
<title data-bascik-prop-title></title>
<meta name="description" data-bascik-attr-content="description">
<meta property="og:type" content="website">
<meta property="og:title" data-bascik-attr-content="title">
<meta property="og:description" data-bascik-attr-content="description">
<meta name="twitter:title" data-bascik-attr-content="title">
<meta name="twitter:description" data-bascik-attr-content="description">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/svg+xml" href="/img/rinsesoft-insignia.svg">
<link rel="apple-touch-icon" href="/img/rinsesoft-insignia.png">
<link rel="preload" as="font" href="/fonts/inter-latin-variable.woff2" type="font/woff2" crossorigin>
<script data-bascik-build src="site-head.ts"></script>
