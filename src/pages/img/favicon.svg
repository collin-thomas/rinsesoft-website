<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -23.5 105 105">
  <style>
    /* paint-order puts the stroke BEHIND the text fill, keeping the letters crisp */
    .rs-text {
      font-family: 'Arial Black', Impact, sans-serif;
      font-weight: 900;
      font-size: 72px;
      paint-order: stroke fill;
      stroke-linejoin: round;
    }
  </style>

  <!-- The 'R' (White fill, thinner Black outline) -->
  <g transform="translate(26, 55) skewX(-15)">
    <text class="rs-text" fill="#FFFFFF" stroke="#000000" stroke-width="4" text-anchor="middle">R</text>
  </g>

  <!-- The 'S' (Neon fill, thinner Black outline) -->
  <g transform="translate(70, 55) skewX(-15)">
    <text class="rs-text" fill="#D4FF00" stroke="#000000" stroke-width="4" text-anchor="middle">S</text>
  </g>
</svg>
