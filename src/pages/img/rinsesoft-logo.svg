<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 60" width="100%" height="100%">
  <style>
    /* paint-order puts the stroke BEHIND the text fill, keeping the letters crisp */
    .rs-text {
      font-family: 'Arial Black', Impact, sans-serif;
      font-weight: 900;
      font-size: 72px;
      paint-order: stroke fill;
      stroke-linejoin: round;
    }
  </style>



  <!-- The 'R' (White fill, thinner Black outline) -->
  <g transform="translate(27, 56) skewX(-15)">
    <text class="rs-text" fill="#FFF" stroke="#000000" stroke-width="4" text-anchor="middle">R</text>
  </g>

  
    <!-- The 'S' (Neon fill, thinner Black outline) -->
  <g transform="translate(71, 56) skewX(-15)">
    <text class="rs-text" fill="#D4FF00" stroke="#000000" stroke-width="4" text-anchor="middle">S</text>
  </g>


    <g transform="translate(236, 56) skewX(-15)">
    <text class="rs-text" fill="#FFF" stroke="#000000" stroke-width="4" text-anchor="middle">RINSE</text>
  </g>
      <g transform="translate(468, 56) skewX(-15)">
    <text class="rs-text" fill="#D4FF00" stroke="#000000" stroke-width="4" text-anchor="middle">SOFT</text>
  </g>
  

</svg>
